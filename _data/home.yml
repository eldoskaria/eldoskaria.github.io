principles:
  - title: A great platform removes the need for human intervention
    text: If an operator is running a script to fix a candidate's booking, the platform has failed. I push for self-service and automation that take the toil out of operations.
  - title: Security and compliance are non-negotiable
    text: In regulated, high-stakes assessment, GDPR and CCPA aren't extras. They shape the design from the first conversation, not the last.
  - title: Understand what engineers are actually solving for
    text: I started as an analyst programmer, so I read trade-offs in technical terms, not just ticket terms, and translate them clearly for non-technical stakeholders.

capabilities:
  - title: Platform product strategy
    text: Vision, strategy and roadmap tied to commercial and customer outcomes, balancing long-term platform health with near-term delivery.
    tags: [Roadmaps, OKRs, Prioritisation, Pricing]
  - title: API and integration strategy
    text: Build-versus-buy decisions, vendor selection and migrations to better-fit services, from replacing Zoom to switching timezone APIs.
    tags: [REST APIs, Vendor selection, Cost optimisation]
  - title: Data governance and migration
    text: Data mapping, transformation and migration across compliance-critical systems with lineage preserved and GDPR/CCPA met.
    tags: [Data migration, Lineage, GDPR / CCPA]
  - title: Cross-functional leadership
    text: Leading a team of support consultants, developers and a technical analyst, and aligning engineering, UX, operations and partners.
    tags: [Agile / Scrum, Stakeholders, Partners]
  - title: Operational automation
    text: Turning repetitive operational work into reliable, auditable tooling, including AI-assisted automation of bulk setup in the booking portal.
    tags: [Python, Playwright, AI-assisted delivery]

